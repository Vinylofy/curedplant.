name: "Curedplant | Price | Sounds Venlo"
run-name: "Price | Sounds Venlo | ${{ github.event_name == 'schedule' && 'scheduled write' || (inputs.write && 'write=true' || 'write=false') }} | limit=${{ github.event_name == 'schedule' && '0' || inputs.limit }}"

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: "current = Windows collector; windows-baseline = read-only Linux comparison"
        required: true
        default: current
        type: choice
        options:
          - windows-baseline
          - current
      limit:
        description: "0 = native full catalogue; positive = pages/products pilot"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean
      approved_dry_run_id:
        description: "Optional source run ID: false=recheck, true=write reviewed prices; max 6 hours"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  windows:
    if: inputs.source_version != 'windows-baseline' && !inputs.approved_dry_run_id
    uses: ./.github/workflows/price-windows-catalog.yml
    with:
      worker: soundsvenlo
      limit: ${{ github.event_name == 'schedule' && '0' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
  reviewed-source-or-baseline:
    if: inputs.source_version == 'windows-baseline' || inputs.approved_dry_run_id
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      source_version: ${{ inputs.source_version || 'current' }}
      approved_dry_run_id: ${{ inputs.approved_dry_run_id || '' }}
      worker: soundsvenlo
      limit: ${{ inputs.limit }}
      write: ${{ inputs.write }}
    secrets: inherit
