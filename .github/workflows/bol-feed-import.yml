name: "Curedplant | Affiliate | bol | Approved FTPS import"
run-name: "bol FTPS NL | ${{ inputs.mode }}"
on:
  # The policy-controlled dispatcher owns the sole two-hour schedule.
  workflow_dispatch:
    inputs:
      mode:
        description: "Publication requires separate explicit approval; full import also requires API chain paused"
        type: choice
        options: [dry_run, diagnose_writer, audit_catalogue, audit_supplemental, pilot_review_write, pilot_write, full_write]
        default: dry_run
      audit_review_run_id:
        description: "Read-only audit: completed full feed-review workflow run"
        type: string
        default: "42363509733"
      audit_api_sample:
        description: "Read-only: compare twenty missing feed EANs with current Marketing API offers"
        type: boolean
        default: false
      reviewed_run_id:
        description: "For pilot_review_write: trusted main workflow containing the reviewed selection"
        type: string
        default: "42364543669"
      expected_feed_sha256:
        description: "Required for pilot: SHA-256 of the explicitly reviewed feed"
        type: string
        default: "1e5bed487fbc25766d1a57832f24764d960b9c5766f8e7a5f7003da938654971"
      approve_publication:
        description: "I explicitly approve this public NL database import"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ contains(fromJSON('["diagnose_writer","audit_catalogue"]'), inputs.mode) && 'bol-feed-diagnostics' || 'bol-feed' }}
  cancel-in-progress: false
jobs:
  audit_catalogue:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_catalogue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          BOL_AUDIT_RUN_ID: ${{ inputs.audit_review_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.BOL_AUDIT_RUN_ID || '')) throw new Error('Review run required');
            const run_id = Number(process.env.BOL_AUDIT_RUN_ID);
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id
            });
            if (run.conclusion !== 'success' || run.path !== '.github/workflows/bol-feed-review.yml') {
              throw new Error('Trusted completed full read-only feed review required');
            }
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id
            });
            const artifact = data.artifacts.find(a => a.name === `bol-feed-review-${run_id}` && !a.expired);
            if (!artifact) throw new Error('Full review artifact unavailable');
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id, archive_format: 'zip'
            });
            const fs = require('node:fs/promises');
            await fs.mkdir('work/bol-audit', {recursive: true});
            await fs.writeFile('work/bol-audit/review.zip', Buffer.from(archive.data));
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'lxml>=5,<6'
      - name: Audit existing catalogue and optional current API sample without writes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOL_API_CLIENT_ID: ${{ inputs.audit_api_sample && secrets.BOL_API_CLIENT_ID || '' }}
          BOL_API_CLIENT_SECRET: ${{ inputs.audit_api_sample && secrets.BOL_API_CLIENT_SECRET || '' }}
          BOL_SITE_ID: ${{ vars.BOL_SITE_ID }}
          BOL_AUDIT_API: ${{ inputs.audit_api_sample }}
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile('work/bol-audit/review.zip') as archive:
              Path('work/bol-audit/review.json').write_bytes(archive.read('review.json'))
          command = [sys.executable, '-m', 'scripts.workers.bol_feed_audit',
              '--review', 'work/bol-audit/review.json', '--api-sample',
              '20' if os.environ['BOL_AUDIT_API']=='true' else '0']
          if os.environ['BOL_AUDIT_API']=='true': command.append('--catalog-facts')
          subprocess.run(command, check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bol-catalogue-audit-${{ github.run_id }}
          path: output/bol/catalogue-audit.json
          retention-days: 1
  reviewed_pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot_review_write' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require explicit publication approval and trusted main artifact
        uses: actions/github-script@v8
        env:
          BOL_APPROVE: ${{ inputs.approve_publication }}
          BOL_REVIEW_RUN: ${{ inputs.reviewed_run_id }}
          BOL_EXPECTED_SHA256: ${{ inputs.expected_feed_sha256 }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main' || process.env.BOL_APPROVE !== 'true' ||
                !/^[0-9a-f]{64}$/.test(process.env.BOL_EXPECTED_SHA256 || '') ||
                !/^[0-9]+$/.test(process.env.BOL_REVIEW_RUN || '')) throw new Error('Approved main pilot and reviewed checksum required');
            const run_id = Number(process.env.BOL_REVIEW_RUN);
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id
            });
            if (run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.status !== 'completed' ||
                run.path !== '.github/workflows/bol-feed-import.yml' || !run.display_title.includes('pilot_write')) {
              throw new Error('Recovery requires a completed trusted main pilot workflow');
            }
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id
            });
            const artifact = data.artifacts.find(a => a.name === `bol-feed-import-${run_id}` && !a.expired);
            if (!artifact) throw new Error('Reviewed pilot artifact unavailable');
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id, archive_format: 'zip'
            });
            const fs = require('node:fs/promises');
            await fs.mkdir('work/bol-pilot', {recursive: true});
            await fs.writeFile('work/bol-pilot/review.zip', Buffer.from(archive.data));
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing importer dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'lxml>=5,<6'
      - name: Recover only the approved twenty-product selection through the existing writer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOL_SITE_ID: ${{ vars.BOL_SITE_ID }}
          BOL_SHOP_IDS: '{"NL":"f08437c2-1d85-47a6-94f9-33a55612d5cc"}'
          BOL_EXPECTED_SHA256: ${{ inputs.expected_feed_sha256 }}
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile('work/bol-pilot/review.zip') as archive:
              Path('work/bol-pilot/review.json').write_bytes(archive.read('review.json'))
          subprocess.run([sys.executable, '-m', 'scripts.importers.bol_feed',
              '--profile', 'config/bol-feed.live.json', '--review-plan', 'work/bol-pilot/review.json',
              '--markets', 'NL', '--limit', '20', '--write', '--approve-publication',
              '--expected-feed-sha256', os.environ['BOL_EXPECTED_SHA256']], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bol-reviewed-pilot-${{ github.run_id }}
          path: output/bol/review.json
          retention-days: 1
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose_writer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing importer dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'lxml>=5,<6'
      - name: Read writer diagnostics without feed login or database writes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.importers.bol_feed --profile config/bol-feed.live.json --diagnose-writer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bol-writer-diagnostics-${{ github.run_id }}
          path: output/bol/review.json
          retention-days: 1
  import:
    if: ${{ github.event_name == 'workflow_dispatch' && !contains(fromJSON('["diagnose_writer","audit_catalogue","pilot_review_write"]'), inputs.mode) }}
    runs-on: [self-hosted, Windows, "${{ vars.BOL_FEED_RUNNER || 'X64' }}"]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Check publication and source-handover conditions before credentials
        uses: actions/github-script@v8
        env:
          BOL_EXPECTED_SHA256: ${{ inputs.expected_feed_sha256 }}
          BOL_MODE: ${{ inputs.mode }}
          BOL_APPROVE: ${{ inputs.approve_publication }}
        with:
          script: |
            const mode = process.env.BOL_MODE;
            if (!['dry_run', 'diagnose_writer', 'audit_supplemental', 'pilot_write', 'full_write'].includes(mode)) throw new Error('Unknown mode');
            if (!['dry_run', 'diagnose_writer', 'audit_supplemental'].includes(mode) && (context.ref !== 'refs/heads/main' || process.env.BOL_APPROVE !== 'true')) {
              throw new Error('Publication requires main and explicit approval');
            }
            if (mode === 'pilot_write' && !/^[0-9a-f]{64}$/.test(process.env.BOL_EXPECTED_SHA256 || '')) {
              throw new Error('Pilot requires the reviewed source SHA-256');
            }
            if (mode === 'full_write') {
              const {data: policyFile} = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'config/bol-feed-automation.json', ref: 'main'
              });
              const policy = JSON.parse(Buffer.from(policyFile.content, 'base64').toString('utf8'));
              if (policy.version !== 1 || policy.enabled !== true || policy.mode !== 'live' || policy.publication_allowed !== true) {
                throw new Error('Full publication is locked while repository policy is read-only shadow');
              }
              const {data} = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'config/bol-price-cycle.json', ref: 'main'
              });
              const config = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              if (config.enabled !== false) throw new Error('Full FTPS writes require the automatic API chain paused after the verified pilot');
              const {data: runs} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'price-bol-api.yml', per_page: 100
              });
              if (runs.workflow_runs.some(run => run.status !== 'completed')) {
                throw new Error('Wait for all existing API workflow runs to finish before full FTPS publication');
              }
            }
      - name: Verify whitelisted public IPv4 before using feed credentials
        working-directory: ${{ runner.temp }}
        env:
          BOL_FEED_PUBLIC_IPV4: ${{ vars.BOL_FEED_PUBLIC_IPV4 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Invoke-RestMethod -Uri 'https://api4.ipify.org' -TimeoutSec 15).ToString().Trim()
          $address = [System.Net.IPAddress]::Parse($actual)
          if ($address.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
              throw 'Expected a public IPv4 address'
          }
          Write-Output "Runner public IPv4: $actual"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "bol feed runner public IPv4: $actual"
          if ($actual -ne $env:BOL_FEED_PUBLIC_IPV4) {
              throw 'Configure this IP in bol Account > Productfeed and BOL_FEED_PUBLIC_IPV4; no feed login attempted.'
          }
      - name: Download exact source commit through GitHub API
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const destination = path.join(process.env.RUNNER_TEMP,
              `bol-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
            await fs.mkdir(destination);
            const { data } = await github.rest.repos.downloadZipballArchive({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            await fs.writeFile(path.join(destination, 'source.zip'), Buffer.from(data));
            core.exportVariable('BOL_ARCHIVE_DIR', destination);
      - name: Extract source to a Windows-safe path
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid GITHUB_WORKSPACE: repository names ending in a dot are not
          # ordinary Win32 directory names. Use the immutable commit archive.
          $destination = $env:BOL_ARCHIVE_DIR
          $archive = Join-Path $destination 'source.zip'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $sourceDirs = @(Get-ChildItem -LiteralPath $destination -Directory)
          if ($sourceDirs.Count -ne 1) { throw 'Unexpected source archive layout' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "BOL_SOURCE_DIR=$($sourceDirs[0].FullName)"
      - name: Set up uv without Python installer scripts
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.15'
          working-directory: ${{ runner.temp }}
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/bol-uv-cache
      - name: Prepare isolated Python and importer dependencies
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for the Python environment.' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-python'
          $venv = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv'
          $python = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
              uv venv --no-project --seed --managed-python --python 3.12 --link-mode copy $venv
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # uv checks the retained environment first; satisfied requirements are a no-op.
          uv pip install --python $python 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'lxml>=5,<6'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8 -Value (Join-Path $venv 'Scripts')
      - name: Download trusted complete primary review for read-only supplemental search
        if: ${{ inputs.mode == 'audit_supplemental' }}
        uses: actions/github-script@v8
        env:
          BOL_REFERENCE_RUN: ${{ inputs.audit_review_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.BOL_REFERENCE_RUN || '')) throw new Error('Primary review run required');
            const run_id=Number(process.env.BOL_REFERENCE_RUN);
            const {data:run}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id});
            if (run.conclusion!=='success' || run.path!=='.github/workflows/bol-feed-review.yml') throw new Error('Successful primary review required');
            const {data}=await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id});
            const artifact=data.artifacts.find(a=>a.name===`bol-feed-review-${run_id}` && !a.expired);
            if (!artifact) throw new Error('Primary review artifact unavailable');
            const archive=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:artifact.id,archive_format:'zip'});
            const fs=require('node:fs/promises'),path=require('node:path');
            const directory=path.join(process.env.BOL_SOURCE_DIR,'work','supplemental');
            await fs.mkdir(directory,{recursive:true});await fs.writeFile(path.join(directory,'reference.zip'),Buffer.from(archive.data));
      - name: Run existing controlled importer
        working-directory: ${{ runner.temp }}
        shell: python {0}
        env:
          BOL_FEED_USERNAME: ${{ secrets.BOL_FEED_USERNAME }}
          BOL_FEED_PASSWORD: ${{ secrets.BOL_FEED_PASSWORD }}
          BOL_SITE_ID: ${{ vars.BOL_SITE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOL_SHOP_IDS: '{"NL":"f08437c2-1d85-47a6-94f9-33a55612d5cc"}'
          BOL_EXPECTED_SHA256: ${{ inputs.expected_feed_sha256 }}
          BOL_MODE: ${{ inputs.mode }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          mode = os.environ['BOL_MODE']
          command = [sys.executable, '-m', 'scripts.importers.bol_feed',
              '--profile', 'config/bol-feed.live.json', '--markets', 'NL',
              '--max-rows', '5000000', '--limit', '0' if mode == 'full_write' else '20']
          if mode == 'audit_supplemental':
              import zipfile
              source = Path(os.environ['BOL_SOURCE_DIR'])
              with zipfile.ZipFile(source / 'work/supplemental/reference.zip') as archive:
                  (source / 'work/supplemental/reference.json').write_bytes(archive.read('review.json'))
              command.extend(['--check-matches','--supplemental-reference','work/supplemental/reference.json'])
          elif mode == 'diagnose_writer':
              command.extend(['--diagnose-writer'])
          elif mode == 'dry_run':
              command.append('--check-matches')
          else:
              command.extend(['--write', '--approve-publication'])
          if mode == 'pilot_write':
              command.extend(['--expected-feed-sha256', os.environ['BOL_EXPECTED_SHA256']])
          if mode == 'full_write':
              state = Path(os.environ['LOCALAPPDATA']) / 'Vinylofy' / 'bol-feed-state.json'
              command.extend(['--state', str(state), '--coverage-policy', 'config/bol-feed-automation.json'])
          subprocess.run(command, cwd=os.environ['BOL_SOURCE_DIR'], check=True)
      - name: Save import evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bol-feed-import-${{ github.run_id }}
          path: ${{ env.BOL_SOURCE_DIR }}/output/bol/review.json
          retention-days: 1
