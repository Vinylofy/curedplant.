name: "Curedplant | Price | Vinylfreaks"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Pages/products for this worker"
        required: true
        default: "1"
        type: string
      write:
        description: "Write to database where supported"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      worker: vinylfreaks
      limit: ${{ inputs.limit }}
      write: ${{ inputs.write }}
    secrets: inherit
