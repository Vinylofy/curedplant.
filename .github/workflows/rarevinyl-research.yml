name: 'RareVinyl | Read-only source pilot | Ubuntu'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rarevinyl-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m unittest tests.test_rarevinyl -v
      - run: python -m scripts.scrapers.rarevinyl --pages 2 --details 10 --delay 1.5 --output rarevinyl-pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarevinyl-research-${{ github.run_id }}
          path: rarevinyl-pilot.json
          retention-days: 7
          if-no-files-found: warn
