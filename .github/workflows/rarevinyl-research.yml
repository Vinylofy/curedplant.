name: 'RareVinyl | Read-only source pilot | Ubuntu'
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/scrapers/rarevinyl.py'
      - 'scripts/workers/rarevinyl_*.py'
      - 'tests/test_rarevinyl*.py'
      - '.github/workflows/rarevinyl-research.yml'
permissions:
  contents: read
concurrency:
  group: rarevinyl-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2'
      - run: python -m unittest tests.test_rarevinyl tests.test_rarevinyl_staging tests.test_rarevinyl_prices -v
      - run: python tests/run_rarevinyl_postgres.py
      - run: python -m scripts.scrapers.rarevinyl --pages 2 --details 10 --delay 1.5 --verify-markets --output rarevinyl-pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarevinyl-research-${{ github.run_id }}
          path: rarevinyl-pilot.json
          retention-days: 7
          if-no-files-found: warn
