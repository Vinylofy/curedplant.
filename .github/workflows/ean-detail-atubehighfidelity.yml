name: "Curedplant | EAN and album detail | A Tube High Fidelity | Resumable"
on:
  workflow_dispatch:
    inputs:
      detail_limit:
        description: 'Detail requests per batch: 1..25; resumes automatically'
        type: string
        default: '25'
permissions:
  contents: read
concurrency:
  group: atubehighfidelity-source
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'psycopg[binary]==3.2.12' 'python-dotenv==1.1.1'
      - name: Verify shop parser and price safety
        run: python -m unittest discover -s tests -p 'test_atube*.py'
      - uses: actions/cache/restore@v4
        with:
          path: output/atubehighfidelity/state.json
          key: atube-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: atube-source-v1-
      - name: Continue catalogue and detail cycle without database access
        env:
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
        run: python -m scripts.workers.atube_catalogue_cycle --batch-size "$DETAIL_LIMIT" --until-complete --max-seconds 1500
      - uses: actions/cache/save@v4
        if: always() && hashFiles('output/atubehighfidelity/state.json') != ''
        with:
          path: output/atubehighfidelity/state.json
          key: atube-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atubehighfidelity-details-${{ github.run_id }}
          path: output/atubehighfidelity/
          retention-days: 14
          if-no-files-found: warn
