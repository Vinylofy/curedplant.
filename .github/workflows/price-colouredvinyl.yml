name: "Curedplant | Price | Colouredvinyl"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "0 = native full catalogue; positive = pages/products pilot"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database where supported"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      worker: colouredvinyl
      limit: ${{ github.event_name == 'schedule' && '0' || inputs.limit }}
      write: ${{ inputs.write }}
    secrets: inherit
