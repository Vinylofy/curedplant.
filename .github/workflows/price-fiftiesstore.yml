name: "Curedplant | Price | FiftiesStore"
run-name: "Price | FiftiesStore | ${{ github.event_name == 'schedule' && 'scheduled write' || (inputs.write && 'write=true' || 'write=false') }} | limit=${{ github.event_name == 'schedule' && '0' || inputs.limit }}"

on:
  schedule:
    - cron: "56 2 */2 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "0 = native full catalogue; positive = pages/products pilot"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      worker: fiftiesstore
      limit: ${{ github.event_name == 'schedule' && '0' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
