name: "Maintenance | price history query plan"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]'
      - name: Inspect query plan without executing it
        run: |
          python - <<'PY'
          import ast, os, psycopg
          tree = ast.parse(open('scripts/maintenance/snapshot_current_prices_to_history.py').read())
          main = next(x for x in tree.body if isinstance(x, ast.FunctionDef) and x.name == 'main')
          sql = next(ast.literal_eval(x.value) for x in main.body if isinstance(x, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'to_insert_sql' for t in x.targets))
          with psycopg.connect(os.environ['DATABASE_URL'], options='-c statement_timeout=10000') as conn:
              rows = conn.execute("select indexname, indexdef from pg_indexes where schemaname='public' and tablename in ('price_history','prices') order by tablename,indexname").fetchall()
              for row in rows: print(*row)
              for row in conn.execute('explain ' + sql, (48,['in_stock','unknown'],'2026-11-27','2026-11-27')): print(row[0])
              conn.execute('set enable_nestloop = off')
              print('PLAN WITH NESTED LOOPS DISABLED')
              for row in conn.execute('explain ' + sql, (48,['in_stock','unknown'],'2026-11-27','2026-11-27')): print(row[0])
          PY
