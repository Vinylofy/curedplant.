name: "Curedplant | Internal | Velvet Delft source worker"
on:
  workflow_call:
    inputs:
      write:
        type: boolean
        default: false
      mode:
        type: string
        required: true
      max_pages:
        type: string
        default: '25'
      automatic:
        type: boolean
        default: false
      refresh:
        type: boolean
        default: false
      detail_limit:
        type: string
        default: '100'
    secrets:
      DATABASE_URL:
        required: false
permissions:
  contents: write
concurrency:
  group: velvetdelft-source
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'details' && 120 || 60 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.13.4' 'psycopg[binary]==3.2.12' 'python-dotenv==1.1.1'
      - uses: actions/cache/restore@v4
        with:
          path: output/velvetdelft/state.json
          key: velvetdelft-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: velvetdelft-v1-
      - name: Restore durable source checkpoint or reviewed discovery baseline
        run: python -m scripts.workers.velvetdelft_schedule restore
      - name: Plan initial daily or weekly maintenance budget
        id: plan
        env:
          AUTOMATIC: ${{ inputs.automatic && 'true' || 'false' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
        run: |
          args=()
          if [ "$AUTOMATIC" = true ]; then args+=(--automatic); fi
          python -m scripts.workers.velvetdelft_schedule plan --limit "$DETAIL_LIMIT" "${args[@]}"
      - name: Verify durable checkpoint access before source requests
        if: steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.workers.velvetdelft_schedule persist
      - name: Offline parser, gatekeeper and failure tests
        if: steps.plan.outputs.enabled == 'true'
        run: python -m unittest discover -s tests -p 'test_velvetdelft*.py'
      - name: Check database access before any new source requests
        if: inputs.write && (steps.plan.outputs.enabled == 'true' || steps.plan.outputs.database_pending == 'true')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.workers.velvetdelft_database_audit --require-write
      - name: Write previously collected EANs before starting more source work
        if: inputs.write && steps.plan.outputs.database_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.scrapers.usf.jobs.velvetdelft_pipeline --capture output/velvetdelft/state.json --write --out output/velvetdelft/database-before.json
      - name: Collect listing or EAN data without database credentials
        id: collect
        if: steps.plan.outputs.enabled == 'true'
        env:
          MODE: ${{ inputs.mode }}
          MAX_PAGES: ${{ inputs.max_pages }}
          DETAIL_LIMIT: ${{ steps.plan.outputs.limit }}
          AUTOMATIC: ${{ inputs.automatic && 'true' || 'false' }}
          REFRESH: ${{ inputs.refresh && 'true' || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$MODE" = details ] && [ ! -f output/velvetdelft/state.json ]; then
            echo 'Run Velvet Delft Discovery first to create a checkpoint.' >&2
            exit 1
          fi
          args=()
          if [ "$AUTOMATIC" = true ]; then args+=(--automatic); fi
          if [ "$REFRESH" = true ]; then args+=(--refresh); fi
          python -m scripts.scrapers.velvetdelft --mode "$MODE" --max-pages "$MAX_PAGES" --detail-limit "$DETAIL_LIMIT" --max-seconds 3300 "${args[@]}"
      - name: Write the current source results through USF
        if: always() && inputs.write && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') && hashFiles('output/velvetdelft/state.json') != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [ "$SOURCE_MODE" = prices ]; then args+=(--prices-only); fi
          python -m scripts.scrapers.usf.jobs.velvetdelft_pipeline --capture output/velvetdelft/state.json --write "${args[@]}"
      - name: Save source progress to the repository even after an access failure
        if: always() && (steps.plan.outputs.enabled == 'true' || (inputs.write && steps.plan.outputs.database_pending == 'true')) && hashFiles('output/velvetdelft/state.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.workers.velvetdelft_schedule persist
      - name: Importer header validation and dry-run
        if: success() && steps.plan.outputs.enabled == 'true'
        run: python -m scripts.importers.import_velvetdelft --dry-run
      - name: USF staging and promotion preview without database connection
        if: success() && steps.plan.outputs.enabled == 'true'
        run: python -m scripts.scrapers.usf.jobs.velvetdelft_pipeline --capture output/velvetdelft/state.json
      - uses: actions/cache/save@v4
        if: always() && (steps.plan.outputs.enabled == 'true' || (inputs.write && steps.plan.outputs.database_pending == 'true')) && hashFiles('output/velvetdelft/state.json') != ''
        with:
          path: output/velvetdelft/state.json
          key: velvetdelft-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report measured coverage and quality
        if: always() && hashFiles('output/velvetdelft/summary.json') != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('output/velvetdelft/summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Velvet Delft — source and USF processing\n\n')
              for key in ('unique_vinyl_releases','verified_eans','valid_listing_prices','availability','requests','detail_checks_this_run','automation','catalogue_complete','error'):
                  f.write(f'- {key}: `{report[key]}`\n')
              f.write('\nDatabase writes follow the explicit workflow write setting; see database evidence below. EAN automation: daily initial round (max 1000), then weekly (max 250). No delisting.\n')
          PY
      - name: Refresh existing scraper monitoring after successful price writes
        if: success() && inputs.write && (hashFiles('output/velvetdelft/database-before.json') != '' || hashFiles('output/velvetdelft/database-result.json') != '')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.workers.velvetdelft_database_audit --release-controls --refresh-monitor
      - name: Publish actual database write counts
        if: always() && inputs.write
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files=[p for p in (Path('output/velvetdelft/database-before.json'),Path('output/velvetdelft/database-result.json')) if p.exists()]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Database writes\n\n')
              if not files:out.write('No pending source data to import on this date.\n')
              for p in files:
                  result=json.loads(p.read_text())
                  out.write(f"{p.name}: raw inserted={result['raw_inserted']}, prices written={result['prices_written']}, quarantine inserted={result['quarantines_inserted']}, persisted={result['persisted_counts']}\n\n")
          PY
      - name: Explain weekly waiting date without contacting the website
        if: steps.plan.outputs.enabled == 'false'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path('output/velvetdelft/schedule.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Velvet Delft: no source requests today\n\n'+plan['reason']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && (steps.plan.outputs.enabled == 'true' || (inputs.write && steps.plan.outputs.database_pending == 'true'))
        with:
          name: velvetdelft-${{ inputs.mode }}-${{ github.run_id }}
          path: output/velvetdelft/
          retention-days: 90
          if-no-files-found: warn
