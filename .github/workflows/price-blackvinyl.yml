name: "Curedplant | Price | Blackvinyl"

on:
  schedule:
    - cron: "17 2 */2 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Pages/products for this worker"
        required: true
        default: "1"
        type: string
      write:
        description: "Write to database where supported"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      worker: blackvinyl
      limit: ${{ inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
