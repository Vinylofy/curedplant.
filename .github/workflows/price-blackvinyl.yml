name: "Curedplant | Price | Blackvinyl"
run-name: "Price | Blackvinyl | ${{ github.event_name == 'schedule' && 'scheduled write' || (inputs.write && 'write=true' || 'write=false') }} | limit=${{ github.event_name == 'schedule' && '0' || inputs.limit }}"

on:
  schedule:
    - cron: "14 2 */2 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "0 = native full catalogue; positive = pages/products pilot"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database where supported"
        required: true
        default: false
        type: boolean
      approved_dry_run_id:
        description: "Optional source run ID: false=recheck, true=write reviewed prices; max 6 hours"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      approved_dry_run_id: ${{ inputs.approved_dry_run_id || '' }}
      worker: blackvinyl
      limit: ${{ github.event_name == 'schedule' && '0' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
