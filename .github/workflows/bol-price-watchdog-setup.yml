name: "Curedplant | Bol | Windows watchdog setup"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bol-watchdog-setup
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, Windows, "${{ vars.BOL_FEED_RUNNER || 'X64' }}"]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Download immutable setup to a Windows-safe directory
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const destination = path.join(process.env.RUNNER_TEMP, `bol-watchdog-${context.runId}`);
            await fs.mkdir(destination);
            const {data} = await github.rest.repos.downloadZipballArchive({...context.repo, ref:context.sha});
            await fs.writeFile(path.join(destination,'source.zip'), Buffer.from(data));
            core.exportVariable('BOL_SETUP_ARCHIVE',destination);
      - name: Extract setup
        working-directory: ${{ runner.temp }}
        run: |
          Expand-Archive -LiteralPath (Join-Path $env:BOL_SETUP_ARCHIVE 'source.zip') -DestinationPath $env:BOL_SETUP_ARCHIVE
          $sources = @(Get-ChildItem -LiteralPath $env:BOL_SETUP_ARCHIVE -Directory)
          if ($sources.Count -ne 1) { throw 'Unexpected archive layout' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BOL_SETUP_SOURCE=$($sources[0].FullName)" -Encoding UTF8
      - name: Check persistent local authentication and task permissions
        id: probe
        working-directory: ${{ runner.temp }}
        run: |
          $report = & (Join-Path $env:BOL_SETUP_SOURCE 'scripts\windows\Install-BolPriceWatchdog.ps1') -ProbeOnly
          $report | Set-Content -LiteralPath (Join-Path $env:BOL_SETUP_ARCHIVE 'setup-result.json') -Encoding UTF8
          $status = $report | ConvertFrom-Json
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ready=$($status.ready.ToString().ToLowerInvariant())" -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Bol watchdog preflight: $report" -Encoding UTF8
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        if: steps.probe.outputs.ready == 'true'
        with:
          version: '0.12.15'
          working-directory: ${{ runner.temp }}
          enable-cache: false
      - name: Install watchdog under the existing authenticated account
        if: steps.probe.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-watchdog-python'
          uv python install --managed-python 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (uv python find --managed-python 3.11).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = & (Join-Path $env:BOL_SETUP_SOURCE 'scripts\windows\Install-BolPriceWatchdog.ps1') -PythonPath $python
          $report | Set-Content -LiteralPath (Join-Path $env:BOL_SETUP_ARCHIVE 'setup-result.json') -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Bol watchdog install: $report" -Encoding UTF8
      - name: Save credential-free setup result
        if: always() && env.BOL_SETUP_ARCHIVE != ''
        uses: actions/upload-artifact@v4
        with:
          name: bol-watchdog-setup-${{ github.run_id }}
          path: ${{ env.BOL_SETUP_ARCHIVE }}/setup-result.json
          retention-days: 3
          if-no-files-found: warn
