name: "Curedplant | GrooveSpin | Linux pilot"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of album pages to sample (1–20, read-only)"
        type: string
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Sample release-specific offers without database writes
        env:
          SAMPLE_LIMIT: ${{ inputs.limit }}
        run: python -u -m scripts.workers.groovespin_linux_pilot --limit "$SAMPLE_LIMIT"
      - name: Save pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovespin-linux-pilot-${{ github.run_id }}
          path: output/groovespin-linux-pilot/
          if-no-files-found: warn
          retention-days: 14
