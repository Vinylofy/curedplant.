name: "Curedplant | Audit | My Record Store catalogue scope"
on:
  workflow_dispatch:
    inputs:
      existing_limit:
        description: 'Existing offers to check by barcode; 0 = all (may take an hour)'
        required: true
        default: '20'
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check listing sources and selected existing offers (read-only)
        env:
          MYRECORDSTORE_AUDIT_EXISTING_LIMIT: ${{ inputs.existing_limit }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m scripts.workers.myrecordstore_source_audit
