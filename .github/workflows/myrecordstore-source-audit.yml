name: "Curedplant | Audit | My Record Store catalogue scope"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check complete source coverage against existing prices (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u -m scripts.workers.myrecordstore_source_audit
