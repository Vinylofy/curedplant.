name: "Curedplant | GEBLOKKEERD | EAN/detail | Sounds Venlo"

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: "current: repaired Windows transport; windows-baseline: original read-only comparison"
        required: true
        default: current
        type: choice
        options:
          - windows-baseline
          - current
      limit:
        description: "Detail records for this worker"
        required: true
        default: "25"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_ean-detail-worker.yml
    with:
      source_version: ${{ inputs.source_version || 'current' }}
      worker: soundsvenlo
      limit: ${{ github.event_name == 'schedule' && '25' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
