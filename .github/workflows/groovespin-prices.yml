name: "Curedplant | GrooveSpin | Daily catalogue prices"

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Page ceiling for a read-only pilot or for a full round"
        type: string
        default: "20"
      write:
        description: "Update existing prices after complete release coverage"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: curedplant-groovespin-catalog
  cancel-in-progress: false

jobs:
  prices:
    if: vars.GROOVESPIN_APPROVED_RUNNER != '' && vars.GROOVESPIN_PRICE_LISTING_URL != ''
    runs-on: [self-hosted, Linux, "${{ vars.GROOVESPIN_APPROVED_RUNNER }}"]
    timeout-minutes: 1200
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Crawl overview pages
        env:
          LISTING_URL: ${{ vars.GROOVESPIN_PRICE_LISTING_URL }}
          MAX_PAGES: ${{ github.event_name == 'schedule' && '20000' || inputs.max_pages }}
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=(--url "$LISTING_URL" --max-pages "$MAX_PAGES")
          if [[ "$WRITE" == true ]]; then args+=(--write); fi
          python -u -m scripts.workers.groovespin_prices "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groovespin-prices-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/groovespin-prices/
          retention-days: 14
