name: "Curedplant | EAN/detail | Bestkeptrecords"

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Detail records for this worker"
        required: true
        default: "25"
        type: string
      write:
        description: "Write to database where supported"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_ean-detail-worker.yml
    with:
      worker: bestkeptrecords
      limit: ${{ github.event_name == 'schedule' && '250' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
