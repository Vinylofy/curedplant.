name: "Maintenance | product metadata audit"
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-metadata-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]'
      - name: Audit without publishing individual product data
        run: python scripts/maintenance/product_metadata_quality.py --limit 5000 --output "$RUNNER_TEMP/metadata-quality.csv"
