name: "Curedplant | EAN Detail | Velvet Delft | Daily 1000 then weekly 250"
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      write:
        description: 'Write verified source records, staging and eligible product/price updates'
        type: boolean
        default: true
      automatic:
        description: 'Use daily initial budget (1000) then weekly rotating review (250)'
        type: boolean
        default: true
      detail_limit:
        description: 'Maximum detail checks; automatic mode also enforces daily/weekly budgets (1..1000)'
        type: string
        default: '1000'
permissions:
  contents: write
jobs:
  source:
    uses: ./.github/workflows/_velvetdelft-worker.yml
    with:
      mode: details
      write: ${{ github.event_name == 'schedule' || inputs.write }}
      automatic: ${{ github.event_name == 'schedule' || inputs.automatic }}
      detail_limit: ${{ github.event_name == 'schedule' && '1000' || inputs.detail_limit }}
    secrets: inherit
