name: Curedplant EAN detail worker (reusable)

on:
  workflow_call:
    inputs:
      source_version:
        required: false
        default: current
        type: string
      worker:
        required: true
        type: string
      limit:
        required: false
        default: "25"
        type: string
      write:
        required: false
        default: false
        type: boolean
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.worker }} | Linux | EAN/detail | ${{ inputs.source_version }}
    runs-on: ubuntu-latest
    concurrency:
      group: curedplant-${{ inputs.worker }}-${{ contains(fromJSON('["northendhaarlem","soundsvenlo"]'), inputs.worker) && 'source' || 'detail' }}
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.source_version == 'windows-baseline' && 30 || 60 }}
    env:
      DATABASE_URL: ${{ inputs.source_version != 'windows-baseline' && secrets.DATABASE_URL || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.source_version == 'windows-baseline' && '3.11' || '3.12' }}
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser transport for CDHal, North End or Sounds Venlo
        if: inputs.worker == 'soundsvenlo' || (inputs.source_version != 'windows-baseline' && contains(fromJSON('["cdhal","northendhaarlem"]'), inputs.worker))
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Run EAN/detail worker
        run: |
          set -euo pipefail
          if [ "${{ inputs.source_version }}" = "windows-baseline" ] && [ "${{ inputs.write }}" = "true" ]; then
            echo "Windows baseline is read-only; write=true is not allowed"
            exit 1
          fi
          if [ "${{ inputs.write }}" = "true" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required when write=true"
            exit 1
          fi
          args=(--source-version "${{ inputs.source_version }}" --worker "${{ inputs.worker }}" --limit "${{ inputs.limit }}")
          if [ "${{ inputs.write }}" = "true" ]; then args+=(--write); fi
          python -u -m scripts.workers.run_ean_detail "${args[@]}"
      - name: Upload EAN verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ean-evidence-${{ inputs.worker }}-${{ github.run_id }}
          path: output/ean-pilots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux Windows-source comparison evidence
        if: always() && inputs.source_version == 'windows-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-${{ inputs.worker }}-detail-${{ github.run_id }}
          path: output/windows-baseline/
          if-no-files-found: error
          retention-days: 14
