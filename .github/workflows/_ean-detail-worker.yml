name: Curedplant EAN detail worker (reusable)

on:
  workflow_call:
    inputs:
      worker:
        required: true
        type: string
      limit:
        required: false
        default: "25"
        type: string
      write:
        required: false
        default: false
        type: boolean
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Run EAN/detail worker
        run: |
          set -euo pipefail
          if [ "${{ inputs.write }}" = "true" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required when write=true"
            exit 1
          fi
          args=(--worker "${{ inputs.worker }}" --limit "${{ inputs.limit }}")
          if [ "${{ inputs.write }}" = "true" ]; then args+=(--write); fi
          python -u scripts/workers/run_ean_detail.py "${args[@]}"
      - name: Upload EAN verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ean-evidence-${{ inputs.worker }}-${{ github.run_id }}
          path: output/ean-pilots/
          if-no-files-found: ignore
          retention-days: 14
