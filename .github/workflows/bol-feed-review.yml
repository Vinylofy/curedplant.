name: "Curedplant | Affiliate | bol | Feed review"
run-name: "bol | NL + BE | dry-run | limit=${{ inputs.limit }}"
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of new vinyl products to review"
        type: string
        default: "20"
        required: true
      ip_check_only:
        description: "Only display this Windows runner's public IPv4; no feed login"
        type: boolean
        default: false
      inspect_schema:
        description: "Inspect actual feed headers before validating the field profile"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: bol-feed-review
  cancel-in-progress: false
jobs:
  review:
    # Use the existing Windows machine, registered for this repo or organisation.
    # A Windows OS alone does not guarantee a static public IP.
    runs-on: [self-hosted, Windows, "${{ vars.BOL_FEED_RUNNER || 'X64' }}"]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Verify whitelisted public IPv4 before using feed credentials
        working-directory: ${{ runner.temp }}
        env:
          BOL_FEED_PUBLIC_IPV4: ${{ vars.BOL_FEED_PUBLIC_IPV4 }}
          BOL_IP_ONLY: ${{ inputs.ip_check_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Invoke-RestMethod -Uri 'https://api4.ipify.org' -TimeoutSec 15).ToString().Trim()
          $address = [System.Net.IPAddress]::Parse($actual)
          if ($address.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
              throw 'Expected a public IPv4 address'
          }
          Write-Output "Runner public IPv4: $actual"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value "bol feed runner public IPv4: $actual"
          if ($actual -ne $env:BOL_FEED_PUBLIC_IPV4 -and $env:BOL_IP_ONLY -ne 'true') {
              throw 'Configure this IP in bol Account > Productfeed and BOL_FEED_PUBLIC_IPV4; no feed login attempted.'
          }
      - name: Download exact source commit through GitHub API
        if: ${{ !inputs.ip_check_only }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const destination = path.join(process.env.RUNNER_TEMP,
              `bol-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
            await fs.mkdir(destination);
            const { data } = await github.rest.repos.downloadZipballArchive({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            await fs.writeFile(path.join(destination, 'source.zip'), Buffer.from(data));
            core.exportVariable('BOL_ARCHIVE_DIR', destination);
      - name: Extract source to a Windows-safe path
        working-directory: ${{ runner.temp }}
        if: ${{ !inputs.ip_check_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Avoid GITHUB_WORKSPACE: repository names ending in a dot are not
          # ordinary Win32 directory names. Use the immutable commit archive.
          $destination = $env:BOL_ARCHIVE_DIR
          $archive = Join-Path $destination 'source.zip'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $sourceDirs = @(Get-ChildItem -LiteralPath $destination -Directory)
          if ($sourceDirs.Count -ne 1) { throw 'Unexpected source archive layout' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "BOL_SOURCE_DIR=$($sourceDirs[0].FullName)"
      - name: Set up uv without Python installer scripts
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: ${{ !inputs.ip_check_only }}
        with:
          version: '0.12.15'
          working-directory: ${{ runner.temp }}
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/bol-uv-cache
      - name: Prepare isolated Python and importer dependencies
        working-directory: ${{ runner.temp }}
        if: ${{ !inputs.ip_check_only }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for the Python environment.' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-python'
          $venv = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv'
          $python = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
              uv venv --no-project --seed --managed-python --python 3.12 --link-mode copy $venv
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # uv checks the retained environment first; satisfied requirements are a no-op.
          uv pip install --python $python 'psycopg[binary]>=3.2,<4' 'python-dotenv>=1,<2' 'lxml>=5,<6'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Encoding UTF8 -Value (Join-Path $venv 'Scripts')
      - name: Review official feed (no database credentials)
        working-directory: ${{ runner.temp }}
        if: ${{ !inputs.ip_check_only }}
        shell: python {0}
        env:
          BOL_FEED_USERNAME: ${{ secrets.BOL_FEED_USERNAME }}
          BOL_FEED_PASSWORD: ${{ secrets.BOL_FEED_PASSWORD }}
          BOL_SITE_ID: ${{ vars.BOL_SITE_ID }}
          BOL_PROFILE: ${{ vars.BOL_FEED_PROFILE || 'config/bol-feed.example.json' }}
          BOL_LIMIT: ${{ inputs.limit }}
          BOL_INSPECT_SCHEMA: ${{ inputs.inspect_schema }}
        run: |
          import os, subprocess, sys
          command = [sys.executable, '-m', 'scripts.importers.bol_feed',
              '--profile', os.environ['BOL_PROFILE'], '--limit', os.environ['BOL_LIMIT']]
          if os.environ['BOL_INSPECT_SCHEMA'] == 'true':
              command.append('--inspect-schema')
          subprocess.run(command, cwd=os.environ['BOL_SOURCE_DIR'], check=True)
      - name: Save review evidence only (not the bulk feed)
        if: ${{ always() && !inputs.ip_check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: bol-feed-review-${{ github.run_id }}
          path: ${{ env.BOL_SOURCE_DIR }}/output/bol/review.json
          retention-days: 1
