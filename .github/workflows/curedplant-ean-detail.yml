name: "Curedplant | Ubuntu | EAN detail workers"

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker (all = run every EAN/detail worker)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - bobsvinyl
          - everythingjazz
          - imusic
          - jpc
          - myrecordstore
          - northendhaarlem
          - platenzaak
          - soundshaarlem
          - soundsvenlo
      limit:
        description: "Detail records per worker"
        required: true
        default: "25"
        type: string
      write:
        description: "Write to DATABASE_URL (manual runs default false)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: curedplant-ean-detail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ean-detail:
    name: "EAN/detail | ${{ matrix.worker }}"
    if: (github.event_name != 'schedule' || vars.CUREDPLANT_SCHEDULE_ENABLED == 'true') && (github.event_name == 'schedule' || inputs.worker == 'all' || inputs.worker == matrix.worker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        worker:
          - bobsvinyl
          - everythingjazz
          - imusic
          - jpc
          - myrecordstore
          - northendhaarlem
          - platenzaak
          - soundshaarlem
          - soundsvenlo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Run EAN/detail worker
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_WRITE: ${{ inputs.write }}
        run: |
          set -euo pipefail
          LIMIT="${INPUT_LIMIT:-25}"
          WRITE="${INPUT_WRITE:-false}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            LIMIT="25"
            WRITE="true"
          fi
          args=(--worker "${{ matrix.worker }}" --limit "$LIMIT")
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          python -u scripts/workers/run_ean_detail.py "${args[@]}"
