name: Curedplant daily EAN worker (reusable)

on:
  workflow_call:
    inputs:
      worker:
        required: true
        type: string
      limit:
        required: false
        default: "100"
        type: string
      write:
        required: false
        default: false
        type: boolean
    secrets:
      DATABASE_URL:
        required: true

permissions:
  contents: write

jobs:
  collect:
    name: ${{ inputs.worker }} | Linux | EAN | Next unprocessed records
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: curedplant-${{ inputs.worker }}-detail
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CDHal browser dependency
        if: inputs.worker == 'cdhal'
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Collect next EAN batch
        env:
          WORKER: ${{ inputs.worker }}
          RECORD_LIMIT: ${{ inputs.limit }}
          WRITE_ENABLED: ${{ inputs.write }}
        run: |
          set -euo pipefail
          args=(--worker "$WORKER" --limit "$RECORD_LIMIT")
          if [ "$WRITE_ENABLED" = "true" ]; then args+=(--write); fi
          python -u -m scripts.workers.run_daily_ean "${args[@]}"
      - name: Save EAN batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ean-${{ inputs.worker }}-${{ github.run_id }}
          path: output/daily-ean/
          if-no-files-found: error
          retention-days: 14
