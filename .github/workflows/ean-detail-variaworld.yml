name: "Curedplant | EAN/detail | Variaworld"

on:
  schedule:
    - cron: "51 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new product details (1-1000); daily total never exceeds 1000"
        required: true
        default: "1000"
        type: string
      write:
        description: "Save EAN metadata and progress; never write prices"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  worker:
    uses: ./.github/workflows/_daily-ean-worker.yml
    with:
      worker: variaworld
      limit: ${{ github.event_name == 'schedule' && '1000' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
