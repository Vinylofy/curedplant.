name: Curedplant catalog price worker (reusable)

on:
  workflow_call:
    inputs:
      source_version:
        required: false
        default: current
        type: string
      worker:
        required: true
        type: string
      limit:
        required: false
        default: "1"
        type: string
      write:
        required: false
        default: false
        type: boolean
      approved_dry_run_id:
        required: false
        default: ""
        type: string
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    name: ${{ inputs.worker }} | Linux | Price | ${{ inputs.source_version }}
    runs-on: ubuntu-latest
    concurrency:
      group: curedplant-${{ inputs.worker }}-${{ contains(fromJSON('["northendhaarlem","soundsvenlo"]'), inputs.worker) && 'source' || 'price' }}
      cancel-in-progress: false
    timeout-minutes: ${{ inputs.source_version == 'windows-baseline' && 30 || (inputs.worker == 'jpc' && 300 || 180) }}
    env:
      DATABASE_URL: ${{ inputs.source_version != 'windows-baseline' && secrets.DATABASE_URL || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.source_version == 'windows-baseline' && '3.11' || '3.12' }}
      - name: Verify source evidence provenance
        if: inputs.approved_dry_run_id != ''
        uses: actions/github-script@v8
        env:
          SOURCE_RUN: ${{ inputs.approved_dry_run_id }}
          WORKER: ${{ inputs.worker }}
          WRITE: ${{ inputs.write }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        with:
          script: |
            const id = Number(process.env.SOURCE_RUN);
            if (!Number.isSafeInteger(id) || id <= 0 || process.env.SOURCE_VERSION !== 'current') {
              throw new Error('Source reuse requires a positive run ID and the current source');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
            if (run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_branch !== 'main' || run.event !== 'workflow_dispatch' ||
                !(process.env.WRITE === 'true' ? ['success'] : ['success','failure']).includes(run.conclusion) ||
                run.path !== `.github/workflows/price-${process.env.WORKER}.yml` ||
                Date.now() - Date.parse(run.created_at) > 6 * 3600000) {
              throw new Error('Source run must be a recent successful manual price run from this repository main');
            }
      - name: Download approved read-only price evidence
        if: inputs.approved_dry_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.approved_dry_run_id }}
          name: price-evidence-${{ inputs.worker }}-${{ inputs.approved_dry_run_id }}
          path: output/approved-price-source
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Install shop browser transport where required
        if: inputs.approved_dry_run_id == '' && (contains(fromJSON('["cdhal","soundsvenlo"]'), inputs.worker) || (inputs.source_version != 'windows-baseline' && inputs.worker == 'northendhaarlem'))
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Run catalog price worker
        run: |
          set -euo pipefail
          if [ "${{ inputs.source_version }}" = "windows-baseline" ] && [ "${{ inputs.write }}" = "true" ]; then
            echo "Windows baseline is read-only; write=true is not allowed"
            exit 1
          fi
          if [ "${{ inputs.write }}" = "true" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required when write=true"
            exit 1
          fi
          args=(--source-version "${{ inputs.source_version }}" --worker "${{ inputs.worker }}" --limit "${{ inputs.limit }}")
          if [ "${{ inputs.write }}" = "true" ]; then args+=(--write); fi
          if [ -n "${{ inputs.approved_dry_run_id }}" ]; then args+=(--approved-source-run "${{ inputs.approved_dry_run_id }}" --approved-source-dir output/approved-price-source); fi
          python -u -m scripts.workers.run_catalog_price "${args[@]}"

      - name: Publish JPC diagnostic counts without credentials
        if: always() && inputs.worker == 'jpc' && inputs.source_version == 'current'
        run: python -m scripts.workers.jpc_run_diagnostics

      - name: Upload price source and database verification evidence
        if: always() && inputs.source_version == 'current'
        uses: actions/upload-artifact@v4
        with:
          name: price-evidence-${{ inputs.worker }}-${{ github.run_id }}
          path: output/price-verification/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux Windows-source comparison evidence
        if: always() && inputs.source_version == 'windows-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: windows-baseline-${{ inputs.worker }}-price-${{ github.run_id }}
          path: output/windows-baseline/
          if-no-files-found: error
          retention-days: 14
