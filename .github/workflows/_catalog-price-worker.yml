name: Curedplant catalog price worker (reusable)

on:
  workflow_call:
    inputs:
      worker:
        required: true
        type: string
      limit:
        required: false
        default: "1"
        type: string
      write:
        required: false
        default: false
        type: boolean
    secrets:
      DATABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  run:
    if: github.event_name != 'schedule' || vars.CUREDPLANT_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Run catalog price worker
        run: |
          set -euo pipefail
          if [ "${{ inputs.write }}" = "true" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required when write=true"
            exit 1
          fi
          args=(--worker "${{ inputs.worker }}" --limit "${{ inputs.limit }}")
          if [ "${{ inputs.write }}" = "true" ]; then args+=(--write); fi
          python -u scripts/workers/run_catalog_price.py "${args[@]}"
