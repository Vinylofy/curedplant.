name: "MOV diagnostic | Same URLs | Windows versus Linux"
run-name: "MOV diagnostic | Read-only identical URL comparison"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: "Read-only HTTP comparison | ${{ matrix.label }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: '["ubuntu-latest"]'
          - label: Windows
            runner: '["self-hosted","Windows","X64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 15
    env:
      PROBE_CODE: |
        import hashlib, json, os, platform, re, sys, time
        from pathlib import Path
        import requests

        urls = [
          'https://www.musiconvinyl.com/products/imagine',
          'https://www.musiconvinyl.com/products/jennie-bomb',
          'https://www.musiconvinyl.com/products/don-blackman-don-blackman-blue-vinyl',
        ]
        profiles = {
          'native_fresh': {'User-Agent': 'Mozilla/5.0 VinylofyBot/1.0 (+https://vinylofy.com)',
                           'Accept': 'application/json,text/html;q=0.9,*/*;q=0.8'},
          'adapter_fresh': {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
                            'Accept-Language': 'nl-NL,nl;q=0.9,en;q=0.8'},
        }
        profiles['adapter_catalog_session'] = dict(profiles['adapter_fresh'])
        result = {'os': platform.platform(), 'python': sys.version, 'requests': requests.__version__,
                  'database_writes': 0, 'records': []}
        for profile, headers in profiles.items():
          shared = None
          if profile == 'adapter_catalog_session':
            shared = requests.Session(); shared.headers.update(headers)
            response = shared.get('https://www.musiconvinyl.com/products.json?limit=100&page=1', timeout=(10,30))
            result['catalog_status'] = response.status_code
            if response.status_code in (401,403,429):
              raise SystemExit('Stop on access/rate limit; do not continue probing')
            time.sleep(3)
          for url in urls:
            session = shared or requests.Session()
            session.headers.update(headers)
            row = {'profile': profile, 'url': url}
            try:
              response = session.get(url, timeout=(10,30))
              row.update(status=response.status_code, final_url=response.url,
                bytes=len(response.content), sha256=hashlib.sha256(response.content).hexdigest(),
                content_type=response.headers.get('Content-Type'),
                barcode_labels=sorted(set(re.findall(r'Barcode\s*\(EAN\)[\s\S]{0,160}?(\d{12,14})',response.text,re.I))))
              if response.status_code in (401,403,429):
                result['records'].append(row)
                raise RuntimeError('Stop on access/rate limit; do not continue probing')
            except requests.RequestException as exc:
              row['error'] = type(exc).__name__
            finally:
              if shared is None: session.close()
            print(json.dumps(row), flush=True)
            result['records'].append(row)
            time.sleep(3)
          if shared: shared.close()
        Path(os.environ['RUNNER_TEMP'],'mov-comparison.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same HTTP library on both runners
        working-directory: ${{ runner.temp }}
        shell: python {0}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'requests==2.34.2'], check=True)
      - name: Compare identical requests (no database credentials)
        working-directory: ${{ runner.temp }}
        shell: python {0}
        run: |
          import os
          exec(compile(os.environ['PROBE_CODE'], '<read-only MOV comparison>', 'exec'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mov-comparison-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mov-comparison.json
          retention-days: 3
