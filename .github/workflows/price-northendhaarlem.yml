name: "Curedplant | Price | North End Haarlem"

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: "Linux source: Windows baseline is read-only (max 3 pages / 25 details)"
        required: true
        default: current
        type: choice
        options:
          - windows-baseline
          - current
      limit:
        description: "0 = native full catalogue; positive = pages/products pilot"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

jobs:
  worker:
    uses: ./.github/workflows/_catalog-price-worker.yml
    with:
      source_version: ${{ inputs.source_version || 'current' }}
      worker: northendhaarlem
      limit: ${{ github.event_name == 'schedule' && '0' || inputs.limit }}
      write: ${{ github.event_name == 'schedule' || inputs.write }}
    secrets: inherit
