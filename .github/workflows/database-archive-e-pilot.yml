name: "DATABASE | E drive historical archive"
on:
  schedule:
    - cron: "35 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only inventory or verified archive copy"
        type: choice
        options: [archive-full, archive-bol, restore-test, cleanup-plan, status, inventory]
        default: archive-full
      dataset:
        description: "Historical dataset for archive-full"
        type: choice
        options: [both, raw_shop_scrapes, price_history]
        default: both
      limit:
        description: "Maximum old raw rows to export (1-500)"
        type: number
        default: 10
      batches:
        description: "Maximum batches (1-200)"
        type: number
        default: 1
permissions:
  contents: read
concurrency:
  group: database-archive-e-pilot
  cancel-in-progress: false
jobs:
  export:
    runs-on: [self-hosted, Windows, "${{ vars.BOL_FEED_RUNNER || 'X64' }}"]
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
    steps:
      - name: Download source to a Windows-safe path
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const target = path.join(process.env.RUNNER_TEMP, `archive-source-${context.runId}-${context.runAttempt}`);
            await fs.mkdir(target);
            const { data } = await github.rest.repos.downloadZipballArchive({ ...context.repo, ref: context.sha });
            await fs.writeFile(path.join(target, 'source.zip'), Buffer.from(data));
            core.exportVariable('ARCHIVE_SOURCE_ROOT', target);
      - name: Extract source and confirm E drive
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:ARCHIVE_SOURCE_ROOT
          Expand-Archive -LiteralPath (Join-Path $root 'source.zip') -DestinationPath $root
          $source = @(Get-ChildItem -LiteralPath $root -Directory)
          if ($source.Count -ne 1) { throw 'Unexpected source archive layout' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding UTF8 -Value "ARCHIVE_SOURCE_DIR=$($source[0].FullName)"
          if (-not (Test-Path -LiteralPath 'E:\Vinylofy' -PathType Container)) { throw 'E:\Vinylofy is unavailable' }
          New-Item -ItemType Directory -Path 'E:\Vinylofy\database-archive' -Force | Out-Null
      - name: Export and verify a bounded read-only sample
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'archive-bol'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROW_LIMIT: ${{ github.event_name == 'schedule' && '500' || inputs.limit }}
          BATCH_LIMIT: ${{ github.event_name == 'schedule' && '200' || inputs.batches }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Existing Bol Python environment is unavailable' }
          & $python -m pip --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Python environment unavailable' }
          & $python -m scripts.workers.database_archive_pilot --destination 'E:\Vinylofy\database-archive' --limit $env:ROW_LIMIT --batches $env:BATCH_LIMIT --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Archive historical raw source rows
        if: github.event_name == 'schedule' || (inputs.operation == 'archive-full' && (inputs.dataset == 'both' || inputs.dataset == 'raw_shop_scrapes'))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROW_LIMIT: ${{ github.event_name == 'schedule' && '1000' || inputs.limit }}
          BATCH_LIMIT: ${{ github.event_name == 'schedule' && '200' || inputs.batches }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_full --destination 'E:\Vinylofy\database-archive' --table raw_shop_scrapes --limit $env:ROW_LIMIT --batches $env:BATCH_LIMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Archive historical price observations
        if: github.event_name == 'schedule' || (inputs.operation == 'archive-full' && (inputs.dataset == 'both' || inputs.dataset == 'price_history'))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROW_LIMIT: ${{ github.event_name == 'schedule' && '1000' || inputs.limit }}
          BATCH_LIMIT: ${{ github.event_name == 'schedule' && '200' || inputs.batches }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_full --destination 'E:\Vinylofy\database-archive' --table price_history --limit $env:ROW_LIMIT --batches $env:BATCH_LIMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Inspect archive schemas and dependencies read-only
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inventory'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Restore raw archive samples transactionally
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore-test' && (inputs.dataset == 'both' || inputs.dataset == 'raw_shop_scrapes')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_restore_test --destination 'E:\Vinylofy\database-archive' --table raw_shop_scrapes --files 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Restore price archive samples transactionally
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore-test' && (inputs.dataset == 'both' || inputs.dataset == 'price_history')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_restore_test --destination 'E:\Vinylofy\database-archive' --table price_history --files 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Calculate raw cleanup eligibility without deletes
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cleanup-plan' && (inputs.dataset == 'both' || inputs.dataset == 'raw_shop_scrapes')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_cleanup_plan --destination 'E:\Vinylofy\database-archive' --table raw_shop_scrapes --files 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Calculate price cleanup eligibility without deletes
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cleanup-plan' && (inputs.dataset == 'both' || inputs.dataset == 'price_history')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_cleanup_plan --destination 'E:\Vinylofy\database-archive' --table price_history --files 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
      - name: Report exact archive progress read-only
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'status'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy\bol-feed-venv\Scripts\python.exe'
          & $python -m scripts.workers.database_archive_status --destination 'E:\Vinylofy\database-archive'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ${{ env.ARCHIVE_SOURCE_DIR }}
