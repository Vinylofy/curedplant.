name: "[Windows][Self-hosted] My Record Store"

on:
  schedule:
    - cron: "17 15 * * *"
    - cron: "05 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "price-only"
        type: choice
        options: ["price-only", "detail", "full"]
      listing_max_pages:
        description: "Listing pages; 0 = until scraper stop condition"
        required: true
        default: "25"
        type: string
      detail_limit:
        description: "Detail batch size"
        required: true
        default: "25"
        type: string
      write:
        description: "Write changes"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-myrecordstore-production
  cancel-in-progress: false

jobs:
  myrecordstore:
    name: Run My Record Store pipeline on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: myrecordstore
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/myrecordstore
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/myrecordstore-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: myrecordstore
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'myrecordstore-python'
          $venv = Join-Path $root 'myrecordstore-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent My Record Store environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent My Record Store environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Import = 'requests' },
            @{ Name = 'beautifulsoup4'; Import = 'bs4' },
            @{ Name = 'psycopg[binary]'; Import = 'psycopg' },
            @{ Name = 'python-dotenv'; Import = 'dotenv' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c "import $($package.Import)" 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host 'All My Record Store runtime packages are already available.' }
          $modules = @('scripts/scrapers/usf/jobs/refresh_myrecordstore_listing_prices.py', 'scripts/scrapers/usf/jobs/detail_myrecordstore.py', 'scripts/scrapers/usf/jobs/stage_myrecordstore.py', 'scripts/scrapers/usf/jobs/promote_myrecordstore.py', 'scripts/scrapers/usf/jobs/sync_myrecordstore_listing_prices.py', 'scripts/scrapers/usf/jobs/run_myrecordstore_pipeline.py')
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m scripts.scrapers.usf.jobs.run_myrecordstore_pipeline --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MODE_INPUT: ${{ inputs.mode }}
          LISTING_MAX_PAGES_INPUT: ${{ inputs.listing_max_pages }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt.' }
          if ($env:EVENT_NAME -eq 'schedule') {
            if ($env:SCHEDULE_EXPR -eq '17 15 * * *') { $mode = 'price-only'; $listingMaxPages = 0; $detailLimit = 25 } else { $mode = 'detail'; $listingMaxPages = 25; $detailLimit = 25 }
          } else {
            $mode = $env:MODE_INPUT; $listingMaxPages = [int]$env:LISTING_MAX_PAGES_INPUT; $detailLimit = [int]$env:DETAIL_LIMIT_INPUT
          }
          if ($mode -notin @('price-only', 'detail', 'full')) { throw 'Ongeldige pipeline mode.' }
          if ($listingMaxPages -lt 0) { throw 'listing_max_pages mag niet negatief zijn.' }
          if ($detailLimit -lt 1) { throw 'detail_limit moet minimaal 1 zijn.' }
          Write-Host "[CONFIG] mode=$mode listing_max_pages=$listingMaxPages detail_limit=$detailLimit DATABASE_URL is ingesteld."

      - name: Run My Record Store pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: myrecordstore
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MODE_INPUT: ${{ inputs.mode }}
          LISTING_MAX_PAGES_INPUT: ${{ inputs.listing_max_pages }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          WRITE_INPUT: ${{ inputs.write }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            if ($env:SCHEDULE_EXPR -eq '17 15 * * *') { $mode = 'price-only'; $listingMaxPages = '0'; $detailLimit = '25'; $write = 'true' } else { $mode = 'detail'; $listingMaxPages = '25'; $detailLimit = '25'; $write = 'true' }
          } else {
            $mode = $env:MODE_INPUT; $listingMaxPages = $env:LISTING_MAX_PAGES_INPUT; $detailLimit = $env:DETAIL_LIMIT_INPUT; $write = $env:WRITE_INPUT
          }
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/myrecordstore-venv/Scripts/python.exe'
          $args = @('-u', '-m', 'scripts.scrapers.usf.jobs.run_myrecordstore_pipeline', '--mode', $mode, '--listing-start-page', '1', '--listing-max-pages', $listingMaxPages, '--listing-sleep', '1.0', '--detail-limit', $detailLimit, '--stage-limit', $detailLimit, '--promote-limit', $detailLimit)
          if ($write -eq 'true') { $args += '--write' }
          $outputDir = Join-Path $env:RUNNER_TEMP 'myrecordstore-run'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $log = Join-Path $outputDir 'pipeline.log'
          Write-Host "settings: mode=$mode listing_max_pages=$listingMaxPages detail_limit=$detailLimit write=$write"
          Write-Host "$python $($args -join ' ')"
          & $python @args 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myrecordstore-${{ github.run_id }}
          path: ${{ runner.temp }}/myrecordstore-run/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'myrecordstore-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
