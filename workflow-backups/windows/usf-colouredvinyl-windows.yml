name: "[Windows][Self-hosted] Coloured Vinyl"

on:
  schedule:
    # Dagelijkse listing/prijsrefresh; UTC.
    - cron: "37 17 * * *"
    # Detail enrichment dinsdag en vrijdag; UTC.
    - cron: "17 10 * * 2,5"
    # Stage/promote dinsdag en vrijdag; UTC.
    - cron: "47 11 * * 2,5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Uitvoermodus"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write
      scope:
        description: "Welke stappen uitvoeren"
        required: true
        default: "listing"
        type: choice
        options:
          - full
          - listing
          - detail
          - stage
          - promote
          - listing-detail
          - stage-promote
      detail_limit:
        description: "Maximumaantal detailpagina's"
        required: true
        default: "25"
        type: string
      detail_retry_days:
        description: "Details pas na X dagen opnieuw"
        required: true
        default: "30"
        type: string
      detail_sleep_seconds:
        description: "Pauze tussen detailrequests"
        required: true
        default: "3.0"
        type: string
      stage_limit:
        description: "Maximumaantal stagingrecords"
        required: true
        default: "100"
        type: string
      promote_limit:
        description: "Maximumaantal promoties"
        required: true
        default: "25"
        type: string
      write_confirmation:
        description: "Bij write exact WRITE_COLOUREDVINYL_PIPELINE invullen"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: usf-colouredvinyl-production
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run Coloured Vinyl pipeline on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: colouredvinyl
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/colouredvinyl
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/colouredvinyl-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: colouredvinyl
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'colouredvinyl-python'
          $venv = Join-Path $root 'colouredvinyl-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent Coloured Vinyl environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent Coloured Vinyl environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Import = 'requests' },
            @{ Name = 'beautifulsoup4'; Import = 'bs4' },
            @{ Name = 'psycopg[binary]'; Import = 'psycopg' },
            @{ Name = 'python-dotenv'; Import = 'dotenv' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c "import $($package.Import)" 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host 'All Coloured Vinyl runtime packages are already available.' }
          $modules = @(
            'scripts/scrapers/usf/jobs/run_colouredvinyl_pipeline.py',
            'scripts/scrapers/usf/jobs/refresh_colouredvinyl_listing_prices.py',
            'scripts/scrapers/usf/jobs/detail_colouredvinyl.py',
            'scripts/scrapers/usf/jobs/stage_colouredvinyl.py',
            'scripts/scrapers/usf/jobs/promote_colouredvinyl.py'
          )
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m scripts.scrapers.usf.jobs.run_colouredvinyl_pipeline --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt.' }
          Write-Host '[CONFIG] DATABASE_URL is ingesteld.'

      - name: Run Coloured Vinyl pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: colouredvinyl
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ inputs.mode }}
          SCOPE_INPUT: ${{ inputs.scope }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          DETAIL_RETRY_DAYS_INPUT: ${{ inputs.detail_retry_days }}
          DETAIL_SLEEP_SECONDS_INPUT: ${{ inputs.detail_sleep_seconds }}
          STAGE_LIMIT_INPUT: ${{ inputs.stage_limit }}
          PROMOTE_LIMIT_INPUT: ${{ inputs.promote_limit }}
          WRITE_CONFIRMATION_INPUT: ${{ inputs.write_confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            $mode = 'write'; $detailLimit = '25'; $retryDays = '30'; $sleepSeconds = '3.0'; $stageLimit = '100'; $promoteLimit = '25'; $confirmation = 'WRITE_COLOUREDVINYL_PIPELINE'
            switch ($env:SCHEDULE) {
              '37 17 * * *' { $steps = 'listing' }
              '17 10 * * 2,5' { $steps = 'detail' }
              '47 11 * * 2,5' { $steps = 'stage,promote' }
              default { throw "Unknown schedule: $env:SCHEDULE" }
            }
          } else {
            $mode = $env:MODE_INPUT; $steps = switch ($env:SCOPE_INPUT) { 'full' { 'listing,detail,stage,promote' } 'listing' { 'listing' } 'detail' { 'detail' } 'stage' { 'stage' } 'promote' { 'promote' } 'listing-detail' { 'listing,detail' } 'stage-promote' { 'stage,promote' } default { throw "Unknown scope: $env:SCOPE_INPUT" } }; $detailLimit = $env:DETAIL_LIMIT_INPUT; $retryDays = $env:DETAIL_RETRY_DAYS_INPUT; $sleepSeconds = $env:DETAIL_SLEEP_SECONDS_INPUT; $stageLimit = $env:STAGE_LIMIT_INPUT; $promoteLimit = $env:PROMOTE_LIMIT_INPUT; $confirmation = $env:WRITE_CONFIRMATION_INPUT
            if ($mode -eq 'write' -and $confirmation -ne 'WRITE_COLOUREDVINYL_PIPELINE') { throw 'Invalid write confirmation.' }
          }
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/colouredvinyl-venv/Scripts/python.exe'
          $args = @('-u', '-m', 'scripts.scrapers.usf.jobs.run_colouredvinyl_pipeline', '--mode', $mode, '--steps', $steps, '--detail-limit', $detailLimit, '--detail-retry-days', $retryDays, '--detail-sleep-seconds', $sleepSeconds, '--stage-limit', $stageLimit, '--promote-limit', $promoteLimit)
          Write-Host "settings: mode=$mode steps=$steps detail_limit=$detailLimit retry_days=$retryDays sleep_seconds=$sleepSeconds stage_limit=$stageLimit promote_limit=$promoteLimit"
          & $python @args 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'colouredvinyl-pipeline.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate pipeline summary
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: colouredvinyl
        run: |
          $ErrorActionPreference = 'Stop'
          $summaryPath = Join-Path (Get-Location) 'output/usf-colouredvinyl/pipeline-summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath)) { throw 'pipeline-summary.json ontbreekt.' }
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          $summary | ConvertTo-Json -Depth 20
          if ($summary.success -ne $true) { throw 'Coloured Vinyl-pipeline faalde.' }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colouredvinyl-pipeline-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/colouredvinyl/output/usf-colouredvinyl/**
            ${{ runner.temp }}/colouredvinyl-pipeline.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'colouredvinyl-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
