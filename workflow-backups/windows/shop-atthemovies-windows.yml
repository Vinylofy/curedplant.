name: "[Windows][Self-hosted] At The Movies"

on:
  schedule:
    # Daily combined listing/import run; UTC.
    - cron: "37 21 * * *"

  workflow_dispatch:
    inputs:
      detail_limit:
        description: "Aantal detailpagina's (0 = alleen listing)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "25"
          - "50"
          - "100"
      write:
        description: "Database- en Storagewrites uitvoeren"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vinylofy-atthemovies
  cancel-in-progress: false

jobs:
  run:
    name: Run At The Movies pipeline on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: atthemovies
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/atthemovies
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/atthemovies-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: atthemovies
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'atthemovies-python'
          $venv = Join-Path $root 'atthemovies-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent At The Movies environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent At The Movies environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Check = 'import requests' },
            @{ Name = 'beautifulsoup4'; Check = 'import bs4' },
            @{ Name = 'psycopg[binary]'; Check = 'import psycopg' },
            @{ Name = 'python-dotenv'; Check = 'import dotenv' },
            @{ Name = 'supabase>=2.10,<3'; Check = 'from supabase import create_client' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c $package.Check 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($package in $packages) {
              & $python -c $package.Check 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Dependency check failed after installation: $($package.Name)" }
            }
          } else { Write-Host 'All At The Movies runtime packages are already available.' }
          $modules = @(
            'scripts/scrapers/atthemovies.py',
            'scripts/automation/run_vinylofy_pipeline.py',
            'scripts/importers/import_atthemovies.py'
          )
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/automation/run_vinylofy_pipeline.py --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore persistent detail checkpoint
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: atthemovies
        run: |
          $ErrorActionPreference = 'Stop'
          $checkpoint = Join-Path $env:LOCALAPPDATA 'Vinylofy/atthemovies-checkpoint/atthemovies_products.csv'
          $target = Join-Path (Get-Location) 'data/raw/atthemovies/atthemovies_products.csv'
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          if (Test-Path -LiteralPath $checkpoint) {
            Copy-Item -LiteralPath $checkpoint -Destination $target -Force
            Write-Host "Restored checkpoint: $checkpoint"
          } else { Write-Host 'No persistent At The Movies checkpoint found; starting without detail cache.' }

      - name: Run At The Movies pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: atthemovies
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          WRITE_INPUT: ${{ inputs.write }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/atthemovies-venv/Scripts/python.exe'
          if ($env:EVENT_NAME -eq 'schedule') {
            $detailLimit = '50'; $write = 'true'
          } else {
            $detailLimit = $env:DETAIL_LIMIT_INPUT; $write = $env:WRITE_INPUT
          }
          $output = 'data/raw/atthemovies/atthemovies_products.csv'
          $env:VINYLOFY_SCRAPER_CMD_ATTHEMOVIES = ('"{0}" scripts/scrapers/atthemovies.py --detail-limit {1} --output {2}' -f $python, $detailLimit, $output)
          $args = @('-u', 'scripts/automation/run_vinylofy_pipeline.py', '--shop', 'atthemovies')
          if ($write -ne 'true') { $args += @('--dry-run-import', '--skip-upload') }
          Write-Host "settings: detail_limit=$detailLimit write=$write dry_run_import=$($write -ne 'true')"
          Write-Host "$python $($args -join ' ')"
          & $python @args 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'atthemovies-pipeline.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate importer summary
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: atthemovies
        run: |
          $ErrorActionPreference = 'Stop'
          $summaryPath = Join-Path (Get-Location) 'output/atthemovies_import_summary.json'
          if (-not (Test-Path -LiteralPath $summaryPath)) { throw 'At The Movies importer summary ontbreekt.' }
          Get-Content -LiteralPath $summaryPath -Raw

      - name: Save persistent detail checkpoint
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: atthemovies
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path (Get-Location) 'data/raw/atthemovies/atthemovies_products.csv'
          $checkpoint = Join-Path $env:LOCALAPPDATA 'Vinylofy/atthemovies-checkpoint/atthemovies_products.csv'
          if (Test-Path -LiteralPath $source) {
            New-Item -ItemType Directory -Force -Path (Split-Path $checkpoint) | Out-Null
            Copy-Item -LiteralPath $source -Destination $checkpoint -Force
            Write-Host "Saved checkpoint: $checkpoint"
          } else { Write-Host 'No At The Movies CSV produced; checkpoint unchanged.' }

      - name: Upload At The Movies artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atthemovies-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/atthemovies/data/raw/atthemovies/atthemovies_products.csv
            ${{ github.workspace }}/atthemovies/output/atthemovies_rejects.csv
            ${{ github.workspace }}/atthemovies/output/atthemovies_import_summary.json
            ${{ runner.temp }}/atthemovies-pipeline.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'atthemovies-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
