name: "[Windows][Self-hosted] Sounds"

on:
  schedule:
    # Daily fast listing price update
    - cron: "33 20 * * *"
    # Detail enrichment twice per week: Wednesday + Sunday
    - cron: "12 21 * * 0,3"

  workflow_dispatch:
    inputs:
      listing_max_pages:
        description: "Listing pages; 0 = all pages"
        required: true
        default: "1"
        type: string
      price_only:
        description: "Only fast listing price update"
        required: true
        default: true
        type: boolean
      detail_limit:
        description: "Max detail pages for missing EAN/info"
        required: true
        default: "25"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-sounds-production
  cancel-in-progress: false

jobs:
  run:
    name: Run Sounds USF pipeline on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sounds
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/sounds
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/sounds-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: sounds
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'sounds-python'
          $venv = Join-Path $root 'sounds-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent Sounds environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent Sounds environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Import = 'requests' },
            @{ Name = 'beautifulsoup4'; Import = 'bs4' },
            @{ Name = 'psycopg[binary]'; Import = 'psycopg' },
            @{ Name = 'python-dotenv'; Import = 'dotenv' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c "import $($package.Import)" 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host 'All Sounds runtime packages are already available.' }
          $modules = @(
            'scripts/scrapers/usf/jobs/refresh_sounds_listing_prices.py',
            'scripts/scrapers/usf/jobs/detail_sounds.py',
            'scripts/scrapers/usf/jobs/run_sounds_pipeline.py'
          )
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m scripts.scrapers.usf.jobs.run_sounds_pipeline --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt.' }
          Write-Host '[CONFIG] DATABASE_URL is ingesteld.'

      - name: Run Sounds USF pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: sounds
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LISTING_MAX_PAGES_INPUT: ${{ inputs.listing_max_pages }}
          PRICE_ONLY_INPUT: ${{ inputs.price_only }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          WRITE_INPUT: ${{ inputs.write }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            $listingMaxPages = '0'; $detailLimit = '500'; $write = 'true'
            $priceOnly = if ($env:SCHEDULE -eq '12 21 * * 0,3') { 'false' } else { 'true' }
          } else {
            $listingMaxPages = $env:LISTING_MAX_PAGES_INPUT
            $detailLimit = $env:DETAIL_LIMIT_INPUT
            $write = $env:WRITE_INPUT
            $priceOnly = $env:PRICE_ONLY_INPUT
          }
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/sounds-venv/Scripts/python.exe'
          $args = @(
            '-u', '-m', 'scripts.scrapers.usf.jobs.run_sounds_pipeline',
            '--listing-start-page', '1',
            '--listing-max-pages', $listingMaxPages,
            '--listing-sleep', '0.20',
            '--fast-price-sync',
            '--detail-limit', $detailLimit,
            '--stage-limit', $detailLimit,
            '--promote-limit', $detailLimit,
            '--quarantine-limit', '100'
          )
          if ($priceOnly -eq 'true') { $args += @('--skip-detail', '--skip-stage', '--skip-promote', '--skip-quarantine') }
          if ($write -eq 'true') { $args += '--write' }
          Write-Host "settings: listing_max_pages=$listingMaxPages price_only=$priceOnly detail_limit=$detailLimit write=$write"
          Write-Host "$python $($args -join ' ')"
          & $python @args 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'sounds-pipeline.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-sounds-${{ github.run_id }}
          path: ${{ runner.temp }}/sounds-pipeline.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'sounds-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
